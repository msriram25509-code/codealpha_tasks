<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">CodeAlpha SMS</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="add.html">Add Student</a></li>
                <li><a href="students.html" class="active">Students</a></li>
                <li><a href="index.html" onclick="logout(event)">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="students-header">
            <h1>All Students</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by name or roll number...">
                <button class="btn btn-primary" onclick="searchStudents()">🔍 Search</button>
            </div>
        </div>

        <div id="loadingMessage" class="loading-message">Loading students...</div>
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="table-responsive">
            <table id="studentsTable" class="students-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="studentsBody">
                </tbody>
            </table>
        </div>

        <div id="noDataMessage" class="no-data-message" style="display: none;">
            No students found. <a href="add.html">Add one now</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        let allStudents = [];

        function checkLogin() {
            if (!localStorage.getItem('isLoggedIn')) {
                window.location.href = 'index.html';
            }
        }

        async function loadStudents() {
            try {
                const response = await fetch('http://localhost:5000/api/students');
                allStudents = await response.json();
                displayStudents(allStudents);
            } catch (error) {
                console.error('Error loading students:', error);
                document.getElementById('errorMessage').textContent = '✗ Failed to load students: ' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                document.getElementById('loadingMessage').style.display = 'none';
            }
        }

        function displayStudents(students) {
            const tbody = document.getElementById('studentsBody');
            tbody.innerHTML = '';

            if (students.length === 0) {
                document.getElementById('noDataMessage').style.display = 'block';
                document.getElementById('studentsTable').style.display = 'none';
                return;
            }

            document.getElementById('noDataMessage').style.display = 'none';
            document.getElementById('studentsTable').style.display = 'table';

            students.forEach(student => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.roll_no}</td>
                    <td>${student.email}</td>
                    <td>${student.department}</td>
                    <td>${student.year}</td>
                    <td>
                        <a href="edit.html?id=${student.id}" class="btn-action btn-edit">✏️ Edit</a>
                        <button class="btn-action btn-delete" onclick="deleteStudent(${student.id})">🗑️ Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function searchStudents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStudents.filter(student =>
                student.name.toLowerCase().includes(query) ||
                student.roll_no.toLowerCase().includes(query)
            );
            displayStudents(filtered);
        }

        async function deleteStudent(id) {
            if (!confirm('Are you sure you want to delete this student?')) {
                return;
            }

            try {
                const response = await fetch(`http://localhost:5000/api/students/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Student deleted successfully!');
                    loadStudents();
                } else {
                    alert('Failed to delete student');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error deleting student: ' + error.message);
            }
        }

        window.addEventListener('load', () => {
            checkLogin();
            loadStudents();
        });

        document.getElementById('searchInput').addEventListener('keyup', searchStudents);
    </script>
</body>
</html>
