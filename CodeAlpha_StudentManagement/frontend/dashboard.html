<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">CodeAlpha SMS</div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="add.html">Add Student</a></li>
                <li><a href="students.html">Students</a></li>
                <li><a href="index.html" onclick="logout(event)">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h1>Welcome to Dashboard</h1>
            <p id="userGreeting">Hello, Admin!</p>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-content">
                    <h3>Total Students</h3>
                    <p class="stat-number" id="totalStudents">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-content">
                    <h3>Departments</h3>
                    <p class="stat-number" id="totalDepartments">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-content">
                    <h3>Current Year Students</h3>
                    <p class="stat-number" id="currentYearStudents">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-content">
                    <h3>Database Status</h3>
                    <p class="stat-text" id="dbStatus">Checking...</p>
                </div>
            </div>
        </div>

        <div class="quick-actions">
            <h2>Quick Actions</h2>
            <div class="action-buttons">
                <a href="add.html" class="btn btn-primary">➕ Add New Student</a>
                <a href="students.html" class="btn btn-secondary">👁️ View All Students</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadDashboard() {
            if (!localStorage.getItem('isLoggedIn')) {
                window.location.href = 'index.html';
                return;
            }
            loadStats();
        }

        async function loadStats() {
            try {
                const response = await fetch('http://localhost:5000/api/students');
                const students = await response.json();
                
                document.getElementById('totalStudents').textContent = students.length || 0;
                
                const departments = new Set(students.map(s => s.department));
                document.getElementById('totalDepartments').textContent = departments.size || 0;
                
                const currentYear = new Date().getFullYear();
                const currentYearCount = students.filter(s => s.year === new Date().getFullYear() - 2023).length;
                document.getElementById('currentYearStudents').textContent = currentYearCount || 0;
                
                document.getElementById('dbStatus').textContent = '✓ Connected';
            } catch (error) {
                console.error('Error loading stats:', error);
                document.getElementById('dbStatus').textContent = '✗ Disconnected';
            }
        }

        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
